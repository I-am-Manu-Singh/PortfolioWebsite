<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29"/>
      <stop offset="50%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="4"/>

  <!-- 5 Staff Lines -->
  <g stroke="rgba(255, 255, 255, 0.18)" stroke-width="3.5" stroke-linecap="round">
    <line x1="64" y1="140" x2="448" y2="140"/>
    <line x1="64" y1="172" x2="448" y2="172"/>
    <line x1="64" y1="204" x2="448" y2="204"/>
    <line x1="64" y1="236" x2="448" y2="236"/>
    <line x1="64" y1="268" x2="448" y2="268"/>
  </g>

  <!-- 6 Tab Lines -->
  <g stroke="rgba(56, 189, 248, 0.22)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 0">
    <line x1="64" y1="330" x2="448" y2="330"/>
    <line x1="64" y1="354" x2="448" y2="354"/>
    <line x1="64" y1="378" x2="448" y2="378"/>
    <line x1="64" y1="402" x2="448" y2="402"/>
    <line x1="64" y1="426" x2="448" y2="426"/>
    <line x1="64" y1="450" x2="448" y2="450"/>
  </g>

  <!-- TAB vertical text / badge -->
  <text x="76" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#38BDF8" letter-spacing="3" opacity="0.85">TAB</text>

  <!-- Big Treble Clef Symbol in glowing purple gradient -->
  <text x="82" y="258" font-family="'Apple Symbols', 'Lucida Grande', sans-serif" font-size="160" fill="url(#primaryGrad)" filter="drop-shadow(0 0 16px rgba(139, 92, 246, 0.6))">𝄞</text>

  <!-- Musical Notes on Staff -->
  <!-- Note 1: Quarter note C5 -->
  <ellipse cx="230" cy="188" rx="18" ry="13" transform="rotate(-24 230 188)" fill="url(#accentGrad)" filter="drop-shadow(0 0 8px rgba(56, 189, 248, 0.5))"/>
  <line x1="244" y1="184" x2="244" y2="108" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Note 2 & 3: Beamed Eighth notes E5 to G5 -->
  <ellipse cx="320" cy="156" rx="18" ry="13" transform="rotate(-24 320 156)" fill="url(#primaryGrad)"/>
  <line x1="334" y1="152" x2="334" y2="82" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>

  <ellipse cx="390" cy="124" rx="18" ry="13" transform="rotate(-24 390 124)" fill="url(#primaryGrad)"/>
  <line x1="404" y1="120" x2="404" y2="50" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Beam connector -->
  <polygon points="332,82 406,50 406,64 332,96" fill="url(#primaryGrad)"/>

  <!-- Guitar Tab Fret Numbers on Tab Lines -->
  <!-- Fret 3 on 5th line (string 5) -->
  <rect x="216" y="365" width="28" height="24" rx="6" fill="#11131F" stroke="#38BDF8" stroke-width="2"/>
  <text x="224" y="383" font-family="monospace" font-size="16" font-weight="bold" fill="#38BDF8">3</text>

  <!-- Fret 2 on 4th line (string 4) -->
  <rect x="306" y="389" width="28" height="24" rx="6" fill="#11131F" stroke="#A78BFA" stroke-width="2"/>
  <text x="314" y="407" font-family="monospace" font-size="16" font-weight="bold" fill="#A78BFA">2</text>

  <!-- Fret 0 on 3rd line (string 3) -->
  <rect x="376" y="413" width="28" height="24" rx="6" fill="#11131F" stroke="#A78BFA" stroke-width="2"/>
  <text x="384" y="431" font-family="monospace" font-size="16" font-weight="bold" fill="#A78BFA">0</text>
</svg>
